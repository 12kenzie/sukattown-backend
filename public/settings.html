<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> <!-- Jquery-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script> <!-- Chart.js -->
  <script src="https://kit.fontawesome.com/c6249fb7d2.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles/settings-styles.css">

  <title>SukatTown Dashboard Settings</title>


</head>

<body>
  <div class="app">

    <!-- LEFT NAV -->
    <aside class="left-nav" aria-hidden="true">
      <div class="brand">EL</div>

      <div class="nav" role="navigation" aria-label="Main">
        <button class="active" title="Dashboard" aria-label="Dashboard" onclick="window.location.href='index.html'">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
        </button>

        <button title="Consumption" aria-label="Consumption" onclick="window.location.href='consumption-history.html'">
          <i class="fa-solid fa-bolt" aria-hidden="true"></i>
        </button>

        <button title="Reports" aria-label="Reports">
          <i class="fa-solid fa-chart-area" aria-hidden="true"></i>
        </button>

        <button title="Settings" aria-label="Settings" onclick="window.location.href='settings.html'">
          <i class="fa-solid fa-gear" aria-hidden="true"></i>
        </button>

        <div class="spacer" aria-hidden="true"></div>

        <button title="Help" aria-label="Help">
          <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
        </button>

        <button title="Logout" aria-label="Logout" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        </button>
      </div>
    </aside>


    <div class="main">

      <div class="topbar" role="banner">
        <div class="search-wrap" aria-hidden="false">
          <div style="font-weight:700;color:#10213a">SukatTown</div>
          <span class="status-badge offline" id="connectionStatus">● Offline</span>
        </div>

        <div style="display:flex;align-items:center;gap:16px;justify-self:end">
          <div class="search" role="search" aria-label="Search">
            <i class="fa-brands fa-searchengin" aria-hidden="true"></i>
            <input id="topSearch" type="search" placeholder="Search anything..." aria-label="Search anything">
          </div>

          <!-- PROFILE / GREETING on upper-right -->
          <div class="topbar" role="banner">
            <div class="search-wrap" aria-hidden="false">
              <div style="font-weight:700;color:#10213a">SukatTown</div>
              <span class="status-badge offline" id="connectionStatus">● Offline</span>
            </div>

            <div style="display:flex;align-items:center;gap:16px;justify-self:end">
              <div class="search" role="search" aria-label="Search">
                <i class="fa-brands fa-searchengin" aria-hidden="true"></i>
                <input id="topSearch" type="search" placeholder="Search anything..." aria-label="Search anything">
              </div>

              <!-- PROFILE / GREETING on upper-right -->
              <div class="topbar-right">
                <div class="profile" title="Account">
                  <div class="hello">
                    <span style="font-size:13px;color:var(--muted)">Hello,</span>
                    <strong id="userName">User</strong>
                  </div>
                  <div class="avatar" aria-hidden="true" id="userAvatar">U</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="content-wrap" style="padding: 24px;">
        <div class="page-header">
          <div style="font-size:32px;font-weight:800">Settings</div>
          <div style="color:var(--muted);margin-top:4px">Customize thresholds & alerts</div>
        </div>

        <div class="settings-row">

          <div class="card threshold-card">
            <div class="card-title">Power Threshold</div>
            <div class="muted">Max Power (Watts)</div>
            <input class="number-input" id="maxPower" type="number" min="0" max="15000" placeholder="0 – 15000">
          </div>

          <div class="card center-card">
            <div class="card-title">Alerts & Notifications</div>

            <div class="toggle-row">
              <div class="toggle-label">Enable Notifications</div>
              <label class="switch">
                <input id="notifToggle" type="checkbox">
                <div class="track">
                  <div class="thumb"></div>
                </div>
              </label>
            </div>

            <div class="toggle-row">
              <div class="toggle-label">Sound Alert on Hazard</div>
              <label class="switch">
                <input id="soundToggle" type="checkbox">
                <div class="track">
                  <div class="thumb"></div>
                </div>
              </label>
            </div>
          </div>

          <div class="card sms-card">
            <div class="card-title">SMS Alerts</div>
            <div class="muted">Phone Number</div>
            <input class="number-input" id="smsNumber" type="text">
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="bottom-actions">
    <button class="btn reset" id="resetBtn">Reset</button>
  </div>

  <script>
    const maxPower = document.getElementById('maxPower');
    const notifToggle = document.getElementById('notifToggle');
    const soundToggle = document.getElementById('soundToggle');
    const smsNumber = document.getElementById('smsNumber');

    const defaults = { maxPower: 3000, notif: true, sound: false, sms: '' };

    function loadDefaults() {
      maxPower.value = defaults.maxPower;
      notifToggle.checked = defaults.notif;
      soundToggle.checked = defaults.sound;
      smsNumber.value = defaults.sms;
    }

    function autoSave() {
      if (maxPower.value > 15000) maxPower.value = 15000;
      const data = {
        maxPower: maxPower.value,
        notif: notifToggle.checked,
        sound: soundToggle.checked,
        sms: smsNumber.value
      };
      console.log("Auto-saved:", data);
    }

    loadDefaults();

    [maxPower, notifToggle, soundToggle, smsNumber].forEach(el => {
      el.addEventListener('input', autoSave);
      el.addEventListener('change', autoSave);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      loadDefaults();
      autoSave();
    });
  </script>

</body>

</html>
