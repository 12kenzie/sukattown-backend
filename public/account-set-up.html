<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="styles/account-set-up-styles.css">
  <title>SukatTown Account Set-up</title>
</head>

<body>
  <div class="background"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="tag">⚡ Electricity Dashboard</div>
      <h1>Create Account</h1>
      <p>Fill in your details to register</p>

      <form id="registerForm">
        <label>Full Name</label>
        <input id="name" type="text" placeholder="Enter your full name" required />

        <label>Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" required />
        <small style="display:block;text-align:left;color:#666;margin-top:4px;font-size:12px">
          ✅ @gmail.com, @deped.gov.ph, @depedmarikina.ph
        </small>

        <label>User Type</label>
        <select id="userType" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:12px;margin-top:6px;font-size:15px" required>
          <option value="">Select user type</option>
          <option value="admin">Admin (Capstone Team)</option>
          <option value="teacher">Teacher</option>
          <option value="principal">Principal/Staff</option>
        </select>

        <label>School</label>
        <select id="schoolOption" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:12px;margin-top:6px;font-size:15px" required>
          <option value="new">Create New School</option>
          <option value="existing">Join Existing School</option>
        </select>

        <div id="newSchoolSection" style="display:block;">
          <label>School Name</label>
          <input id="schoolName" type="text" placeholder="e.g., Marikina High School" />
        </div>

        <div id="existingSchoolSection" style="display:none;">
          <label>Select School</label>
          <select id="schoolId" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:12px;margin-top:6px;font-size:15px">
            <option value="">Loading schools...</option>
          </select>
        </div>

        <label>Password</label>
        <input id="password" type="password" placeholder="Create password (min. 6 chars)" required />

        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" placeholder="Confirm password" required />

        <label>Telegram Chat ID (Optional)</label>
        <input id="telegramChatId" type="text" placeholder="Get from @userinfobot" />
        <small style="display:block;text-align:left;color:#666;margin-top:4px;font-size:12px">
          Get your Chat ID from <a href="https://t.me/userinfobot" target="_blank" style="color:#4659ff">@userinfobot</a> on Telegram
        </small>

        <label>Account Type</label>
        <select id="accountType" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:12px;margin-top:6px;font-size:15px">
          <option value="principal">Principal (Bill Payer)</option>
          <option value="non-principal">Non-Principal (Monitor Only)</option>
        </select>

        <button type="submit" class="login-btn">Create Account</button>
      </form>

      <a href="login.html">Already have an account? Sign in</a>
    </div>
  </div>

  <script>
    const API_URL = 'https://sukattown-backend.onrender.com';

    function validateEmail(email) {
      const allowedDomains = ['gmail.com', 'deped.gov.ph', 'depedmarikina.ph'];
      const domain = email.split('@')[1];
      return allowedDomains.includes(domain);
    }

    // Toggle between new/existing school
    $('#schoolOption').on('change', function() {
      if ($(this).val() === 'new') {
        $('#newSchoolSection').show();
        $('#existingSchoolSection').hide();
        $('#schoolName').prop('required', true);
        $('#schoolId').prop('required', false);
      } else {
        $('#newSchoolSection').hide();
        $('#existingSchoolSection').show();
        $('#schoolName').prop('required', false);
        $('#schoolId').prop('required', true);
        loadSchools();
      }
    });

    // Load existing schools
    async function loadSchools() {
      try {
        const response = await fetch(`${API_URL}/api/schools`);
        const data = await response.json();

        const select = $('#schoolId');
        select.html('<option value="">Select a school</option>');

        if (data.success && data.data.length > 0) {
          data.data.forEach(school => {
            select.append(`<option value="${school.id}">${school.name}</option>`);
          });
        } else {
          select.html('<option value="">No schools available - create new</option>');
        }
      } catch (error) {
        console.error('Failed to load schools:', error);
        $('#schoolId').html('<option value="">Error loading schools</option>');
      }
    }

    $('#registerForm').on('submit', async function(e) {
      e.preventDefault();

      const name = $('#name').val().trim();
      const email = $('#email').val().toLowerCase().trim();
      const userType = $('#userType').val();
      const password = $('#password').val();
      const confirmPassword = $('#confirmPassword').val();
      const telegramChatId = $('#telegramChatId').val().trim();
      const accountType = $('#accountType').val();
      const schoolOption = $('#schoolOption').val();
      const schoolName = $('#schoolName').val().trim();
      const schoolId = $('#schoolId').val();

      // Validation
      if (!name) {
        alert('❌ Please enter your full name!');
        return;
      }

      if (!userType) {
        alert('❌ Please select your user type!');
        return;
      }

      if (!validateEmail(email)) {
        alert('❌ Invalid email domain!\n\n✅ Accepted:\n• @gmail.com\n• @deped.gov.ph\n• @depedmarikina.ph');
        return;
      }

      if (schoolOption === 'new' && !schoolName) {
        alert('❌ Please enter a school name!');
        return;
      }

      if (schoolOption === 'existing' && !schoolId) {
        alert('❌ Please select a school!');
        return;
      }

      if (password !== confirmPassword) {
        alert('❌ Passwords do not match!');
        return;
      }

      if (password.length < 6) {
        alert('❌ Password must be at least 6 characters!');
        return;
      }

      const submitBtn = $('.login-btn');
      const originalText = submitBtn.text();
      submitBtn.text('Creating account...').prop('disabled', true);

      try {
        const requestBody = {
          name,
          email,
          user_type: userType,
          password,
          telegram_chat_id: telegramChatId || null,
          account_type: accountType
        };

        if (schoolOption === 'new') {
          requestBody.school_name = schoolName;
        } else {
          requestBody.school_id = schoolId;
        }

        console.log('📤 Sending registration:', requestBody);

        const response = await fetch(`${API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        console.log('📥 Registration response:', data);

        if (data.success) {
          alert(`✅ Account created successfully!\n\n` +
                `Name: ${name}\n` +
                `Email: ${email}\n` +
                `School: ${data.user.school_name}\n` +
                `Type: ${userType}\n\n` +
                `You can now login!`);
          
          $('#registerForm')[0].reset();
          
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1000);
        } else {
          alert('❌ Error: ' + data.message);
          submitBtn.text(originalText).prop('disabled', false);
        }
      } catch (error) {
        console.error('Registration error:', error);
        alert('❌ Failed to create account.\n\nError: ' + error.message);
        submitBtn.text(originalText).prop('disabled', false);
      }
    });

    // Auto-detect user type based on email
    $('#email').on('blur', function() {
      const email = $(this).val().toLowerCase();
      const userTypeSelect = $('#userType');
      
      if (email.includes('@gmail.com')) {
        userTypeSelect.val('admin');
      } else if (email.includes('@deped') || email.includes('@depedmarikina')) {
        if (!userTypeSelect.val()) {
          userTypeSelect.val('teacher');
        }
      }
    });

    // Check if already logged in
    window.addEventListener('load', function() {
      const userId = localStorage.getItem('userId');
      if (userId) {
        if (confirm('You are already logged in. Go to dashboard?')) {
          window.location.href = 'index.html';
        }
      }
    });
  </script>
</body>
</html>
