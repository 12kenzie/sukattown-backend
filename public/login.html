<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="styles/login-styles.css">
  <title>SukatTown Login</title>
</head>

<body>
  <div class="background"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="tag">⚡ Electricity Dashboard</div>
      <h1>Welcome Back</h1>
      <p>Sign in to access your dashboard</p>

      <form id="loginForm">
        <label>Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" required />

        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required />

        <div style="text-align: right; margin-top: -10px; margin-bottom: 16px;">
          <a href="#" style="font-size: 13px; color: #4659ff; text-decoration: none;">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Sign In</button>
      </form>

      <a href="account-set-up.html">Don't have an account? Create one</a>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee;">
        <p style="font-size: 13px; color: #666; margin: 0;">
          🔒 Your data is secure and encrypted
        </p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://sukattown-backend.onrender.com';

    $('#loginForm').on('submit', async function(e) {
      e.preventDefault();

      const email = $('#email').val().toLowerCase().trim(); // ← ADDED .trim()
      const password = $('#password').val();

      if (!email || !password) {
        alert('❌ Please enter both email and password!');
        return;
      }

      // Show loading state
      const submitBtn = $('.login-btn');
      const originalText = submitBtn.text();
      submitBtn.text('Signing in...').prop('disabled', true);

      console.log('📤 Attempting login for:', email); // ← ADDED for debugging

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        console.log('📥 Login response:', data); // ← ADDED for debugging

        if (data.success) {
          // Store user session with school context
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('userName', data.user.name);
          localStorage.setItem('userEmail', data.user.email);
          localStorage.setItem('userType', data.user.user_type);
          localStorage.setItem('accountType', data.user.account_type);
          localStorage.setItem('schoolId', data.user.school_id);
          localStorage.setItem('schoolName', data.user.school_name);
          localStorage.setItem('permissions', JSON.stringify(data.user.permissions || []));
          
          if (data.user.telegram_chat_id) {
            localStorage.setItem('telegramChatId', data.user.telegram_chat_id);
          }

          console.log('✅ Login successful! Stored data:', { // ← ADDED for debugging
            userId: data.userId,
            userName: data.user.name,
            userType: data.user.user_type,
            schoolId: data.user.school_id,
            schoolName: data.user.school_name
          });

          // Show success message with school
          alert(`✅ Welcome back, ${data.user.name}!\n🏫 ${data.user.school_name}`);
          
          // Redirect to dashboard
          window.location.href = 'index.html';
        } else {
          alert('❌ Error: ' + data.message);
          submitBtn.text(originalText).prop('disabled', false);
        }
      } catch (error) {
        console.error('❌ Login error:', error);
        alert('❌ Failed to login. Please check your connection and try again.\n\nError: ' + error.message);
        submitBtn.text(originalText).prop('disabled', false);
      }
    });

    // Check if already logged in
    window.addEventListener('load', function() {
      const userId = localStorage.getItem('userId');
      const schoolId = localStorage.getItem('schoolId');
      const userType = localStorage.getItem('userType');
      
      // Only redirect if ALL required data is present
      if (userId && schoolId && userType) {
        console.log('✅ User already logged in with complete data, redirecting...');
        window.location.href = 'index.html';
      }
    });

    // Allow Enter key to submit
    $('#email, #password').on('keypress', function(e) {
      if (e.which === 13) {
        $('#loginForm').submit();
      }
    });
  </script>
</body>
</html>
